<style>
  *{ box-sizing:border-box; }

  @keyframes shipBob{ 0%,100%{ margin-top:0; } 50%{ margin-top:9px; } }
  @keyframes armWave{ 0%,100%{ transform:rotate(12deg); } 50%{ transform:rotate(-34deg); } }
  @keyframes pulseRing{ 0%{ transform:scale(.8); opacity:.8; } 100%{ transform:scale(1.7); opacity:0; } }
  @keyframes floatCenter{ 0%,100%{ transform:translate(-50%,-50%); } 50%{ transform:translate(-50%,-58%); } }
  @keyframes nebulaDrift{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(24px,-18px); } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes orbit{ to{ transform:rotate(360deg); } }
  @keyframes bgpan{ from{ background-position:0 0; } to{ background-position:-56px 0; } }
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
  @keyframes diveExpand{ 0%{ transform:translate(-50%,-50%) scale(.1); } 100%{ transform:translate(-50%,-50%) scale(24); } }
  @keyframes gameFade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes gameFlash{ from{ opacity:.85; } to{ opacity:0; } }
  @keyframes scrollSpeck{ from{ background-position:0 0; } to{ background-position:0 -90px; } }
  @keyframes riseUp{ 0%{ transform:translateY(90px); opacity:0; } 12%{ opacity:1; } 86%{ opacity:1; } 100%{ transform:translateY(-780px); opacity:0; } }
  @keyframes drillShake{ 0%,100%{ transform:translateX(-50%); } 25%{ transform:translateX(calc(-50% - 1.6px)); } 75%{ transform:translateX(calc(-50% + 1.6px)); } }
  @keyframes dust2{ 0%{ opacity:.9; transform:translate(0,0) scale(1); } 100%{ opacity:0; transform:translate(var(--dx),18px) scale(.3); } }
  @keyframes rockFall{ 0%{ transform:translateY(-80px) rotate(0deg); opacity:0; } 12%{ opacity:1; } 100%{ transform:translateY(1040px) rotate(440deg); opacity:.35; } }
  @keyframes rippleRing{ 0%{ transform:translate(-50%,-50%) scale(.15); opacity:.95; } 100%{ transform:translate(-50%,-50%) scale(3.4); opacity:0; } }
  @keyframes bubbleUp{ 0%{ transform:translateY(0) scale(1); opacity:0; } 16%{ opacity:.9; } 100%{ transform:translateY(-560px) scale(.4); opacity:0; } }
  @keyframes echoPing{ 0%{ transform:translate(-50%,-50%) scale(.1); opacity:1; } 100%{ transform:translate(-50%,-50%) scale(3.6); opacity:0; } }
  @keyframes crackGrow{ 0%{ transform:scaleY(0); opacity:0; } 18%{ opacity:1; } 100%{ transform:scaleY(1); opacity:.85; } }
  @keyframes ember{ 0%{ transform:translateY(0) scale(1); opacity:0; } 20%{ opacity:1; } 100%{ transform:translateY(-500px) scale(.3); opacity:0; } }
  @keyframes warpZoom{ 0%{ transform:translate(-50%,-50%) scale(.25); opacity:0; } 20%{ opacity:1; } 100%{ transform:translate(-50%,-50%) scale(6.5); opacity:0; } }
  @keyframes ringCollapse{ 0%{ transform:translate(-50%,-50%) scale(2.8); opacity:0; } 30%{ opacity:1; } 100%{ transform:translate(-50%,-50%) scale(.05); opacity:.95; } }
  @keyframes coreFlash{ 0%,72%{ opacity:0; } 100%{ opacity:.9; } }
  .node{ transition:transform .18s ease, filter .18s ease; cursor:pointer; }
  .node:hover{ transform:translate(-50%,-50%) scale(1.09); filter:brightness(1.12); }
</style>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { view:'map', level:4, depth:1240, fuel:68, cargo:18 };

  LV = {
    1:{ theme:'rock',  ox:250, oy:865, wash:'#4a3f63', flash:'radial-gradient(circle at 50% 42%,#b9aacb,#3a2f52)' },
    2:{ theme:'water', ox:150, oy:745, wash:'#173f6e', flash:'radial-gradient(circle at 50% 42%,#7fd0f4,#11406e)' },
    3:{ theme:'echo',  ox:320, oy:625, wash:'#0f5e3a', flash:'radial-gradient(circle at 50% 42%,#86ecb6,#0f5e3a)' },
    4:{ theme:'lava',  ox:160, oy:500, wash:'#7a2c0e', flash:'radial-gradient(circle at 50% 42%,#ff9d3c,#d65a1e)' },
    5:{ theme:'magma', ox:330, oy:375, wash:'#6a1810', flash:'radial-gradient(circle at 50% 42%,#f0683c,#5a1d14)' },
    6:{ theme:'void',  ox:150, oy:255, wash:'#1d1238', flash:'radial-gradient(circle at 50% 42%,#7a4fd6,#1d1238)' },
    7:{ theme:'core',  ox:250, oy:135, wash:'#3a1f5e', flash:'radial-gradient(circle at 50% 42%,#ffa6e4,#4a1f78)' },
  };

  enter = (id) => {
    if (this.state.view !== 'map') return;
    this.setState({ view:'diving', level:id });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.startGame(), 820);
  };

  startGame() {
    this.setState({ view:'game', depth:1240, fuel:68, cargo:18 });
    clearInterval(this._iv);
    this._iv = setInterval(() => {
      this.setState(s => ({
        depth: s.depth + 3,
        fuel: Math.max(0, s.fuel - 0.35),
        cargo: Math.min(24, s.cargo + (Math.random() < 0.05 ? 1 : 0)),
      }));
    }, 110);
  }

  back = () => {
    clearInterval(this._iv);
    clearTimeout(this._t);
    this.setState({ view:'map' });
  };

  componentWillUnmount() { clearInterval(this._iv); clearTimeout(this._t); }

  renderVals() {
    const v = this.state.view;
    const lv = this.LV[this.state.level] || this.LV[4];
    const diving = v === 'diving';
    const mapStyle =
      v === 'map' ? { transition:'opacity .5s ease' } :
      diving ? { transform:'scale(6.5)', opacity:0, transformOrigin:`${lv.ox}px ${lv.oy}px`,
                 transition:'transform .82s cubic-bezier(.6,0,.85,.35), opacity .72s ease',
                 pointerEvents:'none' } :
               { opacity:0, pointerEvents:'none' };
    const fuelPct = Math.round(this.state.fuel);
    return {
      isDiving: diving,
      isGame: v === 'game',
      diveRock:  diving && lv.theme === 'rock',
      diveWater: diving && lv.theme === 'water',
      diveEcho:  diving && lv.theme === 'echo',
      diveLava:  diving && lv.theme === 'lava',
      diveMagma: diving && lv.theme === 'magma',
      diveVoid:  diving && lv.theme === 'void',
      diveCore:  diving && lv.theme === 'core',
      gameWash: lv.wash,
      gameFlashGrad: lv.flash,
      e1: () => this.enter(1), e2: () => this.enter(2), e3: () => this.enter(3),
      e4: () => this.enter(4), e5: () => this.enter(5), e6: () => this.enter(6), e7: () => this.enter(7),
      onBack: this.back,
      mapStyle,
      cashStr: (12480).toLocaleString(),
      depthStr: Math.round(this.state.depth).toLocaleString(),
      fuelW: fuelPct + '%',
      cargoStr: this.state.cargo + '/24',
      cargoW: Math.round(this.state.cargo / 24 * 100) + '%',
    };
  }
}
</script>
